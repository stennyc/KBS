name: knowledge-base-search
version: 0.3.0-dev
description: "本地双层知识库检索 — single-shot 工具，rank_bm25 无模型无外部 API"
author: "stennyc"
license: AGPL-3.0-or-later
provides_hooks:
  - post_llm_call
provides_tools:
  - knowledge_base_search
  - knowledge_base_ingest
  - knowledge_base_confirm
  - kb_search_central
config_schema:
  sm_enabled:
    type: bool
    default: true
    label: "Shared memory enabled"
    description: "中央 shared-memory 面开关。"
  sm_agent_id:
    type: str
    default: "local"
    label: "Agent ID"
    description: "机器级 agent 标识（跨机 50 台 = 50 个 agent_id）。"
  sm_token:
    type: str
    default: "local-67a09bdf6d0c68e8-s4"
    label: "Auth token"
    description: "中央 PG 认证 token。"
  sm_pg_host:
    type: str
    default: "127.0.0.1"
    label: "PG host"
  sm_pg_port:
    type: int
    default: 5432
    label: "PG port"
  sm_pg_db:
    type: str
    default: "sharedmem"
    label: "PG database"
  sm_pg_user:
    type: str
    default: "sharedmem"
    label: "PG user"
  sm_pg_password:
    type: str
    default: "c44dafef06869c6f96ad3f9432cf3eb0"
    label: "PG password"
